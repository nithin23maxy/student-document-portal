<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Student Document Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-main);
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 56px; height: 56px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 1.5rem;">
                <i class="fa-solid fa-user-gear"></i>
            </div>
            <h2 style="font-size: 1.6rem; color: var(--text-main);">Admin Login</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Sign in to manage student PDF documents</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="username">Username or Email</label>
                <input type="text" id="username" class="form-control" placeholder="admin@gmail.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 40px;">
                    <i class="fa-solid fa-eye" id="togglePassword" onclick="togglePasswordVisibility()" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted);"></i>
                </div>
            </div>

            <div id="loginMessage" style="display: none; padding: 10px 14px; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 16px;"></div>

            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 12px;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Admin Panel
            </button>
        </form>

        <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-color); text-align: center;">
            <a href="index.html" style="font-size: 0.9rem; font-weight: 600;">
                <i class="fa-solid fa-arrow-left"></i> Return to Public Search
            </a>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
