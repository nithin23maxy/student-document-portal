<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="login-box">

    <h1>Student Document Portal</h1>

    <h3>Administrator Login</h3>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

</div>

<script src="../js/login.js"></script>

</body>
</html>
