<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Student Document Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f172a 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            max-width: 420px;
            padding: 40px 36px;
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .login-card h2 {
            color: #0f172a !important;
            font-weight: 800;
            font-size: 1.65rem;
            margin-bottom: 6px;
        }

        .login-card p.subtitle {
            color: #64748b !important;
            font-size: 0.92rem;
            margin-top: 0;
        }

        .login-card label.form-label {
            color: #1e293b !important;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: block;
        }

        .login-card .form-control {
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            color: #0f172a !important;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            padding: 12px 16px;
            transition: var(--transition);
        }

        .login-card .form-control:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .login-card a.back-link {
            color: var(--primary) !important;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .login-card a.back-link:hover {
            color: var(--primary-hover) !important;
            transform: translateX(-2px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 60px; height: 60px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 1.6rem; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2>Admin Login</h2>
            <p class="subtitle">Sign in to manage student PDF documents</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="username">Username or Email</label>
                <input type="text" id="username" class="form-control" placeholder="admin@gmail.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 44px;">
                    <i class="fa-solid fa-eye" id="togglePassword" onclick="togglePasswordVisibility()" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b; font-size: 1.1rem; padding: 4px;"></i>
                </div>
            </div>

            <div id="loginMessage" style="display: none; padding: 12px 14px; border-radius: var(--radius-md); font-size: 0.9rem; margin-bottom: 18px; font-weight: 500;"></div>

            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 1rem; margin-top: 8px;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Admin Panel
            </button>
        </form>

        <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center;">
            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Return to Public Search
            </a>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
