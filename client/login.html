<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            text-align: center;
            margin-top: 80px;
        }

        .login-box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            color: #2563eb;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 30px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            color: red;
        }

    </style>

</head>


<body>


<div class="login-box">

    <h2>Student Login</h2>


    <input 
        type="email"
        id="email"
        placeholder="Enter Email"
    >


    <input 
        type="password"
        id="password"
        placeholder="Enter Password"
    >


    <button onclick="login()">
        Student Login
    </button>


    <p id="message"></p>


</div>



<script>

async function login() {


    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value.trim();


    if(email === "" || password === "") {

        document.getElementById("message").innerHTML =
        "Please enter email and password";

        return;

    }


    try {


        const response = await fetch("/login", {

            method: "POST",

            headers: {

                "Content-Type": "application/json"

            },

            body: JSON.stringify({

                email: email,

                password: password

            })

        });



        const data = await response.json();



        document.getElementById("message").innerHTML =
        data.message;



        if(data.success) {

            window.location.href = "dashboard.html";

        }


    }

    catch(error) {

        console.log(error);

        document.getElementById("message").innerHTML =
        "Server connection failed";

    }


}


</script>


</body>

</html>
