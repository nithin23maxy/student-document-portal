<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Document - Student Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Student Document Portal</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
            <a href="search.html" class="nav-link active"><i class="fa-solid fa-magnifying-glass"></i> Student Search</a>
            <a href="login.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-lock"></i> Admin Login</a>
        </div>
    </header>

    <main class="container">
        <!-- Search Input Bar -->
        <div class="search-card" style="margin-bottom: 36px;">
            <h2 style="font-size: 1.3rem; margin-bottom: 12px; text-align: center;">Student Document Lookup</h2>
            <form id="searchForm" onsubmit="executeSearch(event)">
                <div class="search-input-group">
                    <input type="text" id="usnQuery" class="search-input" placeholder="Enter USN / Roll Number (e.g. 1MS21CS001)" required autocomplete="off">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>
                </div>
            </form>
        </div>

        <!-- Dynamic Results Container -->
        <div id="resultsContainer">
            <!-- Default Initial State -->
            <div style="text-align: center; color: var(--text-muted); padding: 40px 20px;">
                <i class="fa-solid fa-folder-open" style="font-size: 3rem; color: var(--text-light); margin-bottom: 16px;"></i>
                <p style="font-size: 1.1rem;">Enter a Student USN above to display registered PDF documents.</p>
            </div>
        </div>
    </main>

    <!-- PDF Viewer Modal -->
    <div id="pdfModal" class="modal-backdrop">
        <div class="modal" style="max-width: 900px; height: 85vh; display: flex; flex-direction: column;">
            <div class="modal-header">
                <h3 id="pdfModalTitle"><i class="fa-solid fa-file-pdf" style="color: var(--danger);"></i> PDF Document Viewer</h3>
                <button type="button" class="btn btn-outline btn-sm" onclick="closePdfModal()">
                    <i class="fa-solid fa-xmark"></i> Close
                </button>
            </div>
            <div class="modal-body" style="flex: 1; padding: 0; background: #525659;">
                <iframe id="pdfFrame" src="" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
            <div class="modal-footer" style="justify-content: space-between;">
                <span id="pdfModalFilename" style="font-size: 0.9rem; color: var(--text-muted);"></span>
                <a id="pdfModalDownloadBtn" href="#" download class="btn btn-primary btn-sm">
                    <i class="fa-solid fa-download"></i> Download PDF
                </a>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <script src="js/search.js"></script>
</body>
</html>
