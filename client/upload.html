<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload PDF - Admin Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: var(--light-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">

    <div class="search-card" style="max-width: 480px; width: 100%;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="width: 56px; height: 56px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 1.5rem;">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h2 style="font-size: 1.5rem;">Upload Student PDF</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Add a new academic document to the student database</p>
        </div>

        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label" for="usn">Student USN / Roll No *</label>
                <input type="text" id="usn" name="usn" class="form-control" placeholder="e.g. 1MS21CS001" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="name">Student Full Name *</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="department">Department / Course *</label>
                <input type="text" id="department" name="department" class="form-control" placeholder="e.g. Computer Science" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="doc_title">Document Title (Optional)</label>
                <input type="text" id="doc_title" name="doc_title" class="form-control" placeholder="e.g. 1st Sem Grade Card, Certificate">
            </div>

            <div class="form-group">
                <label class="form-label" for="pdf">Select PDF File *</label>
                <input type="file" id="pdf" name="pdf" class="form-control" accept="application/pdf" required>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 12px;">
                <i class="fa-solid fa-upload"></i> Upload Document
            </button>
        </form>

        <div id="msg" style="margin-top: 16px; text-align: center; font-weight: 600; font-size: 0.9rem;"></div>

        <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-color); text-align: center;">
            <a href="admin.html" style="font-size: 0.9rem; font-weight: 600;">
                <i class="fa-solid fa-arrow-left"></i> Return to Admin Dashboard
            </a>
        </div>
    </div>

    <script src="js/upload.js"></script>
</body>
</html>
